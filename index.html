<style>
:root{
  --bg:#131019;
  --bg-elev:#1b1725;
  --surface:#221d30;
  --surface2:#2b2440;
  --border:#3a3350;
  --gold:#cda449;
  --gold-dim:#8a7233;
  --gold-soft:rgba(205,164,73,0.15);
  --indigo:#7d8cff;
  --danger:#e5535a;
  --danger-soft:rgba(229,83,90,0.15);
  --success:#38caa0;
  --success-soft:rgba(56,202,160,0.15);
  --text:#f3f0ea;
  --text-dim:#a79fc0;
  --text-faint:#6d6585;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Noto Sans JP', sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; }
button{cursor:pointer;}
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; position:relative;}

/* ===== header ===== */
header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--bg-elev), var(--bg));
  gap:8px;
}
.brand{display:flex; align-items:center; gap:8px; min-width:0;}
.brand .mark{
  font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px;
  font-size:18px; color:var(--gold); border:1.5px solid var(--gold); border-radius:6px;
  padding:2px 7px 2px 8px; text-align:center; line-height:1.3; flex:0 0 auto;
}
.brand .titles{min-width:0;}
.brand .sub{font-size:11px; color:var(--text-faint); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand .page-title{font-size:13.5px; color:var(--text-dim); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.header-clock{font-family:'Oswald',sans-serif; font-size:20px; font-weight:600; color:var(--gold); letter-spacing:0.5px; flex:0 0 auto;}

/* ===== main / tabs ===== */
main{flex:1 1 auto; overflow-y:auto; padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch;}

nav#bottomNav{
  position:absolute; left:0; right:0; bottom:2px;
  display:flex; background:var(--bg-elev); border-top:1px solid var(--border);
  padding:5px 4px calc(4px + env(safe-area-inset-bottom,0px));
  border-radius:16px 16px 0 0;
  z-index:20;
}
nav#bottomNav button{
  flex:1; background:none; border:none; color:var(--text-faint); font-family:inherit;
  font-size:10.5px; padding:6px 0 4px; display:flex; flex-direction:column; align-items:center; gap:3px;
  border-radius:10px; font-weight:500;
}
nav#bottomNav button .icon{font-size:18px;}
nav#bottomNav button.active{color:var(--gold);}
nav#bottomNav button.active .icon{filter:drop-shadow(0 0 6px rgba(205,164,73,0.5));}

/* ===== generic ===== */
.section-title{font-size:12.5px; color:var(--gold); letter-spacing:1px; font-weight:700; margin:20px 0 8px;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12.5px; color:var(--text-faint); margin:0 0 14px; text-align:center;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.row{display:flex; align-items:center; gap:8px;}
.row + .row{margin-top:8px;}
.btn{
  background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:11px;
  padding:12px 14px; font-size:14px; font-family:inherit; font-weight:700;
}
.btn:active{transform:scale(0.97);}
.btn.gold{background:var(--gold); color:#221a05; border-color:var(--gold);}
.btn.ghost{background:none; border:1px solid var(--border); color:var(--text-dim); font-weight:500;}
.btn.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
.btn.danger.outline{background:none; color:var(--danger); border-color:var(--danger);}
.btn.small{padding:7px 10px; font-size:12px;}
.btn.block{width:100%;}
.btn.icon-only{padding:9px; width:38px; display:flex; align-items:center; justify-content:center;}
.btn:disabled{opacity:0.4;}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:4px 10px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); white-space:nowrap; flex:0 0 auto;}
.pill.in{background:var(--success-soft); border-color:var(--success); color:var(--success); font-weight:700;}
.pill.out{background:var(--gold-soft); border-color:var(--gold); color:var(--gold); font-weight:700;}
input[type=text], input[type=month]{
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:10px 12px; font-size:14px; font-family:inherit; width:100%;
}
input[type=month]{ color-scheme:dark; }
select{
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:9px 10px; font-size:13px; font-family:inherit; width:100%; color-scheme:dark;
}
input:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
.empty-hint{color:var(--text-faint); font-size:12.5px; text-align:center; padding:26px 10px; border:1px dashed var(--border); border-radius:var(--radius);}
::-webkit-scrollbar{width:0; height:0;}

/* ===== staff select ===== */
.staff-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.staff-btn{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 10px; display:flex; flex-direction:column; align-items:center; gap:8px;
  color:var(--text); font-size:14.5px; font-weight:700;
}
.staff-btn:active{transform:scale(0.96); border-color:var(--gold);}
.staff-avatar{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; color:#1a1520; object-fit:cover;
}
.staff-avatar-wrap{position:relative; flex:0 0 auto;}
.staff-avatar-btn{padding:0; border:none; background:none; border-radius:50%; line-height:0; cursor:pointer;}

.btn.outbtn{background:var(--indigo); border-color:var(--indigo); color:#fff;}

'use strict';
/* =========================================================================

   データ層: Firebase Realtime Database — X8 OPEN CHECKと同じプロジェクト

   categories/items/days等には一切触れない）。
   ホスティング: GitHub Pages（誰でもアクセス可、Claudeのサインイン不要）。

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  ref as fbRef,
  get as fbGet,

// Everything this app stores lives under one top-level key so it can share
// x8clean's database with X8 OPEN CHECK without ever touching that app's data.
const DB_PREFIX = 'timecheck';
function fullPath(path){ return DB_PREFIX + '/' + path; }

// Photos older than this are auto-deleted (see maybeRunPhotoCleanup) so the
// database doesn't grow forever as nights of clock-ins pile up. This only
// ever removes the *photo* — the attendance record itself (time, quote,
// in/out) is never touched by this and is kept forever.
const PHOTO_RETENTION_DAYS = 90;
const PHOTO_CLEANUP_MIN_INTERVAL_MS = 24 * 60 * 60 * 1000; // don't re-scan more than once/day

let db = null;
let rtdb = null;

/* ---------- thin db adapter ----------
   Mirrors a small doc/collection/get/set/update/onSnapshot surface so all
   of the application code below (ported as-is) doesn't need to know it's
   now talking to Firebase's Realtime Database instead of a Claude-artifact
   capability. */
function wrapSnap(fbSnap, id){
  const exists = fbSnap.exists();
  return { id, exists, data: () => exists ? fbSnap.val() : undefined };
}
function makeDocRef(path){
  const segs = path.split('/');
  const id = segs[segs.length-1];
  return {
    id,
    async get(){ const snap = await fbGet(fbRef(rtdb, fullPath(path))); return wrapSnap(snap, id); },
    async set(data){ await fbSet(fbRef(rtdb, fullPath(path)), data); },
    async update(patch){
      // Recursive-merge semantics via a multi-location update: flatten
      // nested objects into slash-joined keys so only the leaves named in
      // `patch` are touched (e.g. one day's events), leaving everything
      // else already stored at this path (other days, other fields) alone.
      const flat = {};
      (function flatten(prefix, obj){
        for(const k in obj){
          const v = obj[k];
          const key = prefix ? prefix + '/' + k : k;
          if(v && typeof v==='object' && !Array.isArray(v)) flatten(key, v);
          else flat[key] = v;
        }
      })('', patch);
      await fbUpdate(fbRef(rtdb, fullPath(path)), flat);
    },
    onSnapshot(next, errCb){
      const r = fbRef(rtdb, fullPath(path));
      return fbOnValue(
        r,
        (snap)=>{ try{ next(wrapSnap(snap, id)); }catch(e){} },
        (err)=>{ if(errCb) errCb({ code:'unavailable', message: err && err.message }); }
      );
    },
    collection(sub){ return makeCollectionRef(path + '/' + sub); }
  };
}
function makeCollectionRef(path){
  return {
    doc(id){ return makeDocRef(id ? path + '/' + id : path + '/' + genPushId()); },
    where(field, op, val){
      return {
        async get(){
          // Note: this project's RTDB rules reject orderByChild/equalTo
          // queries without a matching ".indexOn" rule (confirmed — the
          // server returns "Index not defined"), and that rule can only be
          // added from the Firebase console, not from client code. So this
          // stays a plain fetch-and-filter; callers that care about cost
          // scaling with total history should fetch specific docs directly
          // instead of using .where() (see loadLogForDate).
          const snap = await fbGet(fbRef(rtdb, fullPath(path)));
          const valObj = snap.exists() ? snap.val() : {};
          const docs = [];
          for(const docId in valObj){
            const data = valObj[docId];
            const match = (op==='==') ? (data && data[field]===val) : false;
            if(match) docs.push({ id: docId, data: () => data });
          }
          return { docs };
        }
      };
    }
  };
}

function dayKeyOf(d){ return pad2(d.getDate()); }
function timeStrOf(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function isToday(d){ const n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
function dateLabel(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）' + (isToday(d) ? '・今日' : ''); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function colorFor(id){ let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0; return STAFF_COLORS[h % STAFF_COLORS.length]; }

// Renders a staff member's 宣材写真 (promotional photo) as a circular <img>
// when one has been uploaded (see staffPhotos), falling back to the same
// colored-initial circle as before when it hasn't — so an empty roster of
// photos looks exactly like it did before this feature existed. `size` is
// an optional pixel override for contexts smaller/larger than the default
// grid avatar (e.g. the compact row in 設定, or the bigger one on the
// camera confirm screen).
function avatarHtml(s, size){
  const photo = staffPhotos[s.id];
  const dims = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px;` : '';
  if(photo) return `<img class="staff-avatar" style="${dims}" src="${photo}" alt="">`;
  return `<div class="staff-avatar" style="${dims}background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}

async function init(){
  try{
    const fbApp = initializeApp(FIREBASE_CONFIG);
    rtdb = getDatabase(fbApp);
    db = { doc: makeDocRef, collection: makeCollectionRef };
  }catch(e){ db = null; rtdb = null; }
  subscribeStaff();
  subscribeCustomQuotes();
  subscribeStaffQuotes();
  loadStaffPhotos();
  renderApp();
  setInterval(()=>{
    const el = document.getElementById('headerClock');
    if(el) el.textContent = timeStrOf(new Date());
  }, 15000);
  document.getElementById('headerClock').textContent = timeStrOf(new Date());

  document.getElementById('app').addEventListener('click', onAppClick);
  document.getElementById('toast').addEventListener('click', ()=>{ document.getElementById('toast').classList.remove('show'); });
}

function subscribeStaff(){
  if(!db) { renderApp(); return; }
  unsubStaff = db.doc('config/staff').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      staffList = (data && Array.isArray(data.list)) ? data.list : [];
      renderApp();
    },
    (err)=>{ /* keep last known list on transient error */ }
  );
}

function subscribeCustomQuotes(){
  if(!db) return;
  unsubCustomQuotes = db.doc('config/customQuotes').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      const next = {
        in: (data && Array.isArray(data.in)) ? data.in : [],
        out: (data && Array.isArray(data.out)) ? data.out : [],
      };
      // Skip the re-render when this echo already matches what's in memory —
      // true for almost every echo of our OWN edit, since doAddCustomQuote/
      // doRemoveCustomQuote already applied it optimistically. Settings has
      // two quote forms on one screen inviting back-to-back entry, and a
      // render here does a full main.innerHTML rebuild that would otherwise
      // wipe out whatever the admin is mid-typing into the OTHER field the
      // instant this device's own slow round-trip finally echoes back.
      if(JSON.stringify(next) === JSON.stringify(customQuotes)) return;
      customQuotes = next;
      renderApp();
    },
    (err)=>{ /* keep last known list on transient error */ }
  );
}

function subscribeStaffQuotes(){
  if(!db) return;
  unsubStaffQuotes = db.doc('config/staffQuotes').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      const next = {};
      if(data){
        for(const id in data){ if(Array.isArray(data[id])) next[id] = data[id]; }
      }
      // Same self-echo guard as subscribeCustomQuotes — the 個人の名言 editor
      // also has a text field an admin could be mid-typing into when their
      // own previous save echoes back.
      if(JSON.stringify(next) === JSON.stringify(staffQuotes)) return;
      staffQuotes = next;
      renderApp();
    },
    (err)=>{ /* keep last known list on transient error */ }
  );
}

/* Loads every staffPhotos/{id} dataUrl in one plain REST GET (not the
   onSnapshot/SDK path, same style as loadPhotoCount below). Not live —
   photos change rarely, and re-streaming several MB of image data to every
   open tab on every edit isn't worth it — so this is throttled and re-run
   opportunistically (app start, and each time the clock tab is opened)
   rather than on a subscription. `force` bypasses the throttle right after
   this device itself changes a photo. */
async function loadStaffPhotos(force){
  if(!db) return;
  if(!force && staffPhotosLoadedAt && (Date.now() - staffPhotosLoadedAt) < STAFF_PHOTOS_REFRESH_MS) return;
  try{
    const res = await fetch(FIREBASE_CONFIG.databaseURL + '/' + fullPath('staffPhotos') + '.json');
    const data = await res.json();
    const next = {};
    if(data) for(const id in data){ if(data[id] && data[id].dataUrl) next[id] = data[id].dataUrl; }
    staffPhotos = next;
    staffPhotosLoadedAt = Date.now();
    renderApp();
  }catch(e){ /* keep whatever was already cached; avatars just fall back to initials */ }
}

function onAppClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='switchTab') switchTab(el.dataset.tab);
  else if(action==='selectStaff'){ const s = staffList.find(x=>x.id===el.dataset.id); if(s) selectStaff(s); }
  else if(action==='cancelClock') cancelClock();
  else if(action==='chooseInOut') chooseInOut(el.dataset.type);
  else if(action==='doCapture') doCapture();
  else if(action==='retakePhoto') retakePhoto();
  else if(action==='logPrev'){ const d=new Date(logDate); d.setDate(d.getDate()-1); logDate=d; loadLogForDate(); }
  else if(action==='logNext'){ if(!isToday(logDate)){ const d=new Date(logDate); d.setDate(d.getDate()+1); logDate=d; loadLogForDate(); } }
  else if(action==='openLightbox'){ lightboxOpen=true; lightboxSrc=el.dataset.full; renderLightbox(); }
  else if(action==='closeLightbox'){ lightboxOpen=false; renderLightbox(); }
  else if(action==='removeStaff') removeStaff(el.dataset.id);
  else if(action==='startEditStaffName') startEditStaffName(el.dataset.id);
  else if(action==='saveStaffName') saveStaffName(el.dataset.id);
  else if(action==='cancelEditStaffName') cancelEditStaffName();
  else if(action==='addStaff') addStaff();
  else if(action==='addCustomQuote') addCustomQuote(el.dataset.type);
  else if(action==='removeCustomQuote') removeCustomQuote(el.dataset.type, el.dataset.id);
  else if(action==='addPersonalQuote') addPersonalQuote(el.dataset.id);
  else if(action==='removePersonalQuote') removePersonalQuote(el.dataset.staffId, el.dataset.id);
  else if(action==='pickStaffPhoto') pickStaffPhoto(el.dataset.id);
  else if(action==='removeStaffPhoto') confirmRemoveStaffPhoto(el.dataset.id);
  else if(action==='openBulkPhoto') openBulkPhoto();
  else if(action==='closeBulkPhoto') closeBulkPhoto();
  else if(action==='pickBulkPhotoFiles') pickBulkPhotoFiles();
  else if(action==='removeBulkPhotoItem') removeBulkPhotoItem(Number(el.dataset.idx));
  else if(action==='saveBulkPhotos') saveBulkPhotos();
  else if(action==='dismissSuccess') dismissSuccessNow();
  else if(action==='exportExcel') exportAttendanceExcel();
  else if(action==='modalCancel') closeModal();
  else if(action==='modalConfirmYes') modalConfirmYes();
  else if(action==='modalPasswordSubmit') submitModalPassword();
  else if(action==='deleteLogEntry') deleteLogEntry(el.dataset);
  else if(action==='restoreLogEntry') restoreLogEntry(el.dataset);
  else if(action==='editLogEntry') editLogEntry(el.dataset);
  else if(action==='modalEditTimeSubmit') submitModalEditTime();
  else if(action==='toggleShowDeleted'){ showDeletedLog = !showDeletedLog; renderLog(document.getElementById('main')); }
}

function dismissSuccessNow(){
  if(clockView!=='success') return;
  clockView = 'select'; selectedStaff = null; pendingAction = null; successInfo = null;
  staffSearchQuery = '';
  renderApp();
}

function switchTab(t){
  if(t===tab) return;
  if(t==='log' || t==='settings'){
    showPasswordModal(()=>{ doSwitchTab(t); });
    return;
  }
  doSwitchTab(t);
}

function doSwitchTab(t){
  if(tab==='clock' && clockView==='camera'){ resetPhotoState(); }
  tab = t;
  clockView = 'select';
  selectedStaff = null;
  pendingAction = null;
  cameraViewBuilt = false;
  staffSearchQuery = '';
  document.getElementById('headerTitle').textContent = t==='clock' ? '出退勤' : (t==='log' ? '記録ログ' : '設定');
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  if(t==='log') logLoading = true;
  renderApp();
  if(t==='log') loadLogForDate();
  if(t==='clock') loadStaffPhotos();
}

function renderApp(){
  const main = document.getElementById('main');
  if(tab==='clock'){
    if(clockView==='select') renderClockSelect(main);
    else if(clockView==='chooseAction') renderClockChooseAction(main);
    else if(clockView==='camera') renderClockCamera(main);
    else if(clockView==='success') renderClockSuccess(main);
    else if(clockView==='done') renderClockDone(main);
  } else if(tab==='log'){
    renderLog(main);
  } else if(tab==='settings'){
    renderSettings(main);
  }
}

/* ---------- clock: select ---------- */
function renderClockSelect(main){
  if(!db){
    main.innerHTML = '<div class="empty-hint">この端末ではデータ保存を利用できません</div>';
    return;
  }
  if(!staffList.length){
    main.innerHTML = '<div class="empty-hint">スタッフが登録されていません<br>「設定」タブから追加してください</div>';
    return;
  }
  // A search box only earns its place once the roster is big enough that
  // scanning the whole grid stops being the fastest way to find your name.
  const showSearch = staffList.length > 8;
  main.innerHTML = `
    <div class="hint">出勤・退勤するスタッフをタップしてください</div>
    ${showSearch ? `<input type="text" id="staffSearchInput" placeholder="名前で検索" value="${escapeHtml(staffSearchQuery)}" style="margin-bottom:12px;">` : ''}
    <div class="staff-grid" id="staffGrid">${staffGridHtml()}</div>
  `;
  const searchInput = document.getElementById('staffSearchInput');
  if(searchInput){
    // Updates only the grid's own innerHTML (never re-running
    // renderClockSelect as a whole) so the input never gets torn down and
    // rebuilt mid-keystroke — that would drop focus and the cursor
    // position after every single character typed.
    searchInput.addEventListener('input', ()=>{
      staffSearchQuery = searchInput.value;
      const grid = document.getElementById('staffGrid');
      if(grid) grid.innerHTML = staffGridHtml();
    });
  }
}
function staffGridHtml(){
  const q = staffSearchQuery.trim();
  const filtered = q ? staffList.filter(s => (s.name||'').includes(q)) : staffList;
  if(!filtered.length) return '<div class="empty-hint" style="grid-column:1/-1;">見つかりませんでした</div>';
  return filtered.map(s => `
    <button class="staff-btn" data-action="selectStaff" data-id="${escapeHtml(s.id)}">
      ${avatarHtml(s)}
      <div>${escapeHtml(s.name)}</div>
    </button>
  `).join('');
}

function updateCameraViewState(){
  const placeholder = document.getElementById('camPlaceholder');
  const preview = document.getElementById('camPreview');
  const retakeBtn = document.getElementById('retakeBtn');
  const btn = document.getElementById('actionBtn');
  if(!btn) return;

  const hasPhoto = !!(capturedPhotoBlob && capturedPhotoPreviewUrl);
  if(placeholder) placeholder.style.display = hasPhoto ? 'none' : 'flex';
  if(preview){
    if(hasPhoto){ preview.src = capturedPhotoPreviewUrl; preview.style.display = 'block'; }
    else { preview.style.display = 'none'; preview.removeAttribute('src'); }
  }
  if(retakeBtn) retakeBtn.style.display = hasPhoto ? 'block' : 'none';

  if(pendingAction===null){
    btn.textContent = '確認中…';
    btn.disabled = true;
    btn.className = 'btn block big-action';
    btn.removeAttribute('data-action');
  } else if(hasPhoto){
    btn.textContent = pendingAction==='in' ? '出勤する' : '退勤する';
    btn.disabled = false;
    btn.className = 'btn block big-action ' + (pendingAction==='in' ? 'gold' : 'outbtn');
    btn.dataset.action = 'doCapture';
  } else {
    btn.textContent = '上の枠をタップして撮影してください';
    btn.disabled = true;
    btn.className = 'btn block big-action ghost';
    btn.removeAttribute('data-action');
  }
}

function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (err)=>{ URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

async function onPhotoFileSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const img = await loadImageFromFile(file);
    const w = 480, h = Math.max(1, Math.round(w * img.height / img.width));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.82));
    if(!blob) throw new Error('canvas toBlob failed');
    if(capturedPhotoPreviewUrl) URL.revokeObjectURL(capturedPhotoPreviewUrl);
    capturedPhotoBlob = blob;
    capturedPhotoPreviewUrl = URL.createObjectURL(blob);
  }catch(err){
    showToast('写真の読み込みに失敗しました。もう一度お試しください');
    return;
  }
  updateCameraViewState();
}

function resetPhotoState(){
  if(capturedPhotoPreviewUrl) URL.revokeObjectURL(capturedPhotoPreviewUrl);
  capturedPhotoBlob = null;
  capturedPhotoPreviewUrl = null;
}

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

/* Every photo is stored as a compressed data URL embedded directly in its
   own db document (see doCapture) rather than through the assets/blob
   capability, so viewing never depends on a separate blob fetch resolving
   correctly. Tries progressively smaller/lower-quality encodes until the
   result comfortably clears the per-document size cap.
   These photos are a quick "was it really them" glance, not a print or a
   forensic record, so a fairly aggressive cap is fine — it keeps the
   long-run database size from creeping up as nights of clock-ins pile up.
   The cap is deliberately checked against the *actual encoded size* rather
   than trusted to a single width/quality guess, because the same quality
   number can produce very different file sizes on different phones'
   camera/browser encoders — this loop adapts either way. */
const CLOCKIN_PHOTO_ATTEMPTS = [
  { w: 360, q: 0.6 },
  { w: 320, q: 0.5 },
  { w: 280, q: 0.4 },
  { w: 240, q: 0.35 },
  { w: 200, q: 0.3 },
  { w: 160, q: 0.3 },
];
const CLOCKIN_PHOTO_MAX_CHARS = 60000;

// 宣材写真 (promotional photo): unlike clock-in photos, there's only ever
// one of these per staff member (a re-upload replaces it, nothing piles
// up), so there's no need for the same aggressive cap — this aims notably
// bigger/cleaner since it's meant to actually look good, not just confirm
// a face at a glance. Even at the largest size below, 55 staff members'
// worth is a few MB at most — nowhere near a real storage concern.
const STAFF_PHOTO_ATTEMPTS = [
  { w: 640, q: 0.78 },
  { w: 560, q: 0.72 },
  { w: 480, q: 0.68 },
  { w: 400, q: 0.6 },
  { w: 320, q: 0.55 },
  { w: 240, q: 0.5 },
];
const STAFF_PHOTO_MAX_CHARS = 350000;

async function makeCompressedDataUrl(fileOrBlob, attempts, capChars){
  let img;
  try{ img = await loadImageFromFile(fileOrBlob); }catch(e){ return null; }
  for(const a of attempts){
    const h = Math.max(1, Math.round(a.w * img.height / img.width));
    const canvas = document.createElement('canvas');
    canvas.width = a.w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, a.w, h);
    const smallBlob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',a.q));
    if(!smallBlob) continue;
    const dataUrl = await blobToDataUrl(smallBlob);
    if(dataUrl.length < capChars) return dataUrl;
  }
  return null;
}
function makeInlinePhotoDataUrl(){
  return makeCompressedDataUrl(capturedPhotoBlob, CLOCKIN_PHOTO_ATTEMPTS, CLOCKIN_PHOTO_MAX_CHARS);
}

function retakePhoto(){
  resetPhotoState();
  updateCameraViewState();
}

async function fetchMonthDoc(staffId, monthKey){
  if(!db) return null;
  try{
    const snap = await db.doc('attendance/' + staffId + '_' + monthKey).get();
    return snap.exists ? snap.data() : null;
  }catch(e){ return null; }
}

// Figures out which of 出勤/退勤 are still open today for the selected staff
// member, so the chooseAction screen can grey out whichever one is already
// recorded (soft-deleting a mistaken entry frees that slot back up, same as
// before). If both are already done, skips straight to the done screen —
// there's nothing left to choose. Unlike the old auto-resolve, this no
// longer needs to peek at yesterday's trailing event to *guess* a direction:
// the person now picks it themselves, so only today's own cap matters.
async function resolveChooseAction(){
  const staff = selectedStaff;
  const now = new Date();
  const monthDoc = await fetchMonthDoc(staff.id, monthKeyOf(now));
  const curDay = dayKeyOf(now);
  const todayEvents = ((monthDoc && monthDoc.days && monthDoc.days[curDay] && monthDoc.days[curDay].events) || []).filter(e=>!e.deleted);
  const hasInToday = todayEvents.some(e=>e.type==='in');
  const hasOutToday = todayEvents.some(e=>e.type==='out');

  if(selectedStaff !== staff) return; // user navigated away meanwhile

  if(hasInToday && hasOutToday){
    doneInfo = { name: staff.name };
    clockView = 'done';
    renderApp();
    return;
  }

  chooseActionAvailability = { in: !hasInToday, out: !hasOutToday };
  if(clockView==='chooseAction') renderApp();
}

function selectStaff(staff){
  showConfirmModal('「' + staff.name + '」で間違いないですか？', ()=>doSelectStaff(staff));
}

function doSelectStaff(staff){
  resetPhotoState();
  selectedStaff = staff;
  pendingAction = null;
  chooseActionAvailability = null;
  clockView = 'chooseAction';
  cameraViewBuilt = false;
  renderApp();
  resolveChooseAction();
}

async function doCapture(){
  if(submitting) return;
  if(pendingAction===null) return;
  if(!capturedPhotoBlob) return;
  submitting = true;

  const action = pendingAction;
  const staff = selectedStaff;
  const btn = document.getElementById('actionBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  if(btn){ btn.disabled = true; btn.textContent = '記録中…'; }
  if(retakeBtn) retakeBtn.disabled = true;

  const now = new Date();

  // Defensive re-check: the choice was made (and its availability checked)
  // back on the chooseAction screen, but framing/retaking a photo can take
  // a while, so re-confirm the daily cap right before writing in case
  // today's 出勤+退勤 pair got completed elsewhere in the meantime.
  try{
    const monthDoc = await fetchMonthDoc(staff.id, monthKeyOf(now));
    const dayKey0 = dayKeyOf(now);
    const todayNow = ((monthDoc && monthDoc.days && monthDoc.days[dayKey0] && monthDoc.days[dayKey0].events) || []).filter(e=>!e.deleted);
    const hasInNow = todayNow.some(e=>e.type==='in');
    const hasOutNow = todayNow.some(e=>e.type==='out');
    if(hasInNow && hasOutNow){
      submitting = false;
      resetPhotoState();
      doneInfo = { name: staff.name };
      clockView = 'done'; cameraViewBuilt = false;
      renderApp();
      return;
    }
  }catch(e){ /* can't confirm — fall through and let the normal save proceed */ }

  let photoRef = null;

  // Photos are stored inline as a compressed data URL in their own small
  // db document, right alongside the event — simplest and most reliable
  // across every device, with nothing else to fetch separately.
  try{
    const dataUrl = await makeInlinePhotoDataUrl();
    if(dataUrl){
      const photoDocId = 'ph' + now.getTime().toString(36) + Math.random().toString(36).slice(2,7);
      await db.collection('photos').doc(photoDocId).set({ dataUrl, ts: now.getTime() });
      photoRef = 'inline:' + photoDocId;
    }
  }catch(e){ /* proceed without a photo */ }

  const monthKey = monthKeyOf(now);
  const dayKey = dayKeyOf(now);
  const message = pickRandom(quotePoolForStaff(staff.id, action));
  const event = {
    id: 'ev' + now.getTime().toString(36) + Math.random().toString(36).slice(2,7),
    type:action, time:timeStrOf(now), ts: now.getTime(),
    quote: { text: message.text, by: message.by || null }
  };
  if(photoRef) event.photo = photoRef;
  const photoAttachFailed = !photoRef;

  let saveOk = false;
  try{
    const ref = db.doc('attendance/' + staff.id + '_' + monthKey);
    const snap = await ref.get();
    const existingDays = (snap.exists && snap.data().days) || {};
    const existingEvents = (existingDays[dayKey] && existingDays[dayKey].events) || [];
    const newEvents = existingEvents.concat([event]);
    if(snap.exists){
      await ref.update({ days: { [dayKey]: { events: newEvents } } });
    } else {
      await ref.set({ staffId: staff.id, staffName: staff.name, month: monthKey, days: { [dayKey]: { events: newEvents } } });
    }
    saveOk = true;
  }catch(e){
    try{
      await db.doc('attendance/' + staff.id + '_' + monthKey).set(
        { staffId: staff.id, staffName: staff.name, month: monthKey, days: { [dayKey]: { events: [event] } } }
      );
      saveOk = true;
    }catch(e2){ saveOk = false; }
  }

  submitting = false;

  if(!saveOk){
    showToast('記録に失敗しました。もう一度お試しください');
    resetPhotoState();
    clockView = 'select'; selectedStaff = null; pendingAction = null; cameraViewBuilt = false;
    renderApp();
    return;
  }

  resetPhotoState();
  if(photoAttachFailed) showToast('記録は完了しましたが、写真の保存に失敗しました');
  successInfo = { name: staff.name, action, time: timeStrOf(now), message: message.text, messageBy: message.by || null };
  clockView = 'success';
  cameraViewBuilt = false;
  renderApp();
  // No auto-dismiss: this screen stays up until the viewer taps the message
  // (see dismissSuccessNow), so there's no rush to read it.
}

/* If a stored photo fails to actually load (asset missing/expired, or a
   transient network hiccup), swap the broken <img> for a distinguishable
   placeholder instead of leaving the browser's broken-image icon — that
   way "no photo was ever attached" and "a photo exists but won't load"
   look different, instead of both reading as "no photo". */
window.handleLogThumbError = function(imgEl){
  const div = document.createElement('div');
  div.className = 'log-thumb placeholder broken';
  div.textContent = '!';
  div.title = '写真の読み込みに失敗しました';
  imgEl.replaceWith(div);
};

window.handleLightboxImgError = function(imgEl){
  const div = document.createElement('div');
  div.style.color = '#fff';
  div.style.fontSize = '13px';
  div.textContent = '写真を読み込めませんでした';
  imgEl.replaceWith(div);
};

function logListHtml(){
  if(logLoading) return '<div class="empty-hint">読み込み中…</div>';
  const list = (logEntries || []).filter(e => showDeletedLog ? e.deleted : !e.deleted);
  if(list.length===0){
    return `<div class="empty-hint">${showDeletedLog ? '削除済みの記録はありません' : 'この日の記録はありません'}</div>`;
  }
  return list.map(e => `
    <div class="log-row" data-action="editLogEntry"
      data-staff-id="${escapeHtml(e.staffId||'')}" data-month="${escapeHtml(e.monthKey||'')}" data-day="${escapeHtml(e.dayKey||'')}"
      data-eid="${escapeHtml(e.eid||'')}" data-name="${escapeHtml(e.staffName||'')}" data-type="${e.type}" data-time="${escapeHtml(e.time||'')}">
      ${e.photoSrc
        ? `<img class="log-thumb" src="${e.photoSrc}" data-action="openLightbox" data-full="${e.photoSrc}" onerror="handleLogThumbError(this)">`
        : `<div class="log-thumb placeholder">${escapeHtml((e.staffName||'?').slice(0,1))}</div>`}
      <div class="log-info">
        <div class="log-name">${escapeHtml(e.staffName)}</div>
        <div class="log-time">${e.time}${e.edited ? `<span class="edited-badge" title="編集済み（元の時刻 ${escapeHtml(e.originalTime||'')}）">✎編集済</span>` : ''}</div>
        ${e.quote && e.quote.text ? `<div class="log-quote">${e.quote.by ? '“' : ''}${escapeHtml(e.quote.text)}${e.quote.by ? '”' : ''}${(e.quote.by && e.type!=='in') ? ` <span class="log-quote-by">— ${escapeHtml(e.quote.by)}</span>` : ''}</div>` : ''}
      </div>
      <div class="pill ${e.type==='in' ? 'in' : 'out'}">${e.type==='in' ? '出勤' : '退勤'}</div>
      <button class="btn ghost small" data-action="${e.deleted ? 'restoreLogEntry' : 'deleteLogEntry'}"
        data-staff-id="${escapeHtml(e.staffId||'')}" data-month="${escapeHtml(e.monthKey||'')}" data-day="${escapeHtml(e.dayKey||'')}"
        data-eid="${escapeHtml(e.eid||'')}" data-name="${escapeHtml(e.staffName||'')}" data-type="${e.type}">${e.deleted ? '復元' : '🗑'}</button>
    </div>
  `).join('');
}

async function loadLogForDate(){
  logLoading = true;
  logEntries = null;
  const wrap = document.getElementById('logListWrap');
  if(wrap) wrap.innerHTML = logListHtml();
  const dateHeader = document.querySelector('.log-date');
  if(dateHeader) dateHeader.textContent = dateLabel(logDate);
  const nextBtn = document.querySelector('[data-action="logNext"]');
  if(nextBtn) nextBtn.disabled = isToday(logDate);

  const monthKey = monthKeyOf(logDate);
  const dayKey = dayKeyOf(logDate);
  let entries = [];
  if(db){
    try{
      // Fetch each known staff member's own month-doc directly (the same
      // targeted attendance/{id}_{monthKey} path exportAttendanceExcel
      // already uses) instead of scanning the whole attendance collection
      // — that used to re-download every staff member's *entire* history
      // on every single log view, and only got heavier the longer the
      // club stayed open. This way the read cost scales with headcount
      // (current + ever-removed, via the archive below), which stays
      // small, not with total months of history.
      const idMap = {};
      staffList.forEach(s=>{ idMap[s.id] = s.name; });
      try{
        const archiveSnap = await db.doc('config/staffArchive').get();
        const archive = (archiveSnap.exists && archiveSnap.data()) || {};
        Object.keys(archive).forEach(id=>{ if(!(id in idMap)) idMap[id] = archive[id]; });
      }catch(e){ /* archive is best-effort; current roster alone still works */ }

      const docs = await Promise.all(Object.keys(idMap).map(async id=>{
        try{
          const dsnap = await db.doc('attendance/' + id + '_' + monthKey).get();
          return dsnap.exists ? dsnap.data() : null;
        }catch(e){ return null; }
      }));
      docs.forEach(data=>{
        if(!data) return;
        const dayData = data.days && data.days[dayKey];
        if(dayData && Array.isArray(dayData.events)){
          dayData.events.forEach(ev=>{
            entries.push({
              // Prefer the live name from idMap (current roster, falling back to the
              // archive) over data.staffName, which is frozen into the month-doc the
              // moment it's first created and never touched again by later writes
              // (doCapture's update() branch doesn't include it) — without this, a
              // rename would never show up on that staff member's past log entries.
              staffId: data.staffId || null, staffName: (data.staffId && idMap[data.staffId]) || data.staffName || data.staffId || '?',
              monthKey, dayKey, eid: ev.id || ('ts:'+ev.ts),
              type: ev.type, time: ev.time, ts: ev.ts, photo: ev.photo || null,
              quote: ev.quote || null, deleted: !!ev.deleted,
              edited: !!ev.edited, originalTime: ev.originalTime || null
            });
          });
        }
      });
      entries.sort((a,b)=>a.ts-b.ts);

      // Every photo is stored inline (see doCapture); resolve each
      // "inline:<id>" reference to its actual data URL before rendering.
      const inlineIds = Array.from(new Set(
        entries.filter(e=>e.photo && e.photo.startsWith('inline:')).map(e=>e.photo.slice(7))
      ));
      const inlineMap = {};
      if(inlineIds.length){
        await Promise.all(inlineIds.map(async id=>{
          try{
            const psnap = await db.doc('photos/' + id).get();
            if(psnap.exists) inlineMap[id] = psnap.data().dataUrl;
          }catch(e){ /* leave unresolved; shows placeholder */ }
        }));
      }
      entries.forEach(e=>{
        e.photoSrc = (e.photo && e.photo.startsWith('inline:')) ? (inlineMap[e.photo.slice(7)] || null) : null;
      });
    }catch(e){ entries = []; }
  }
  logEntries = entries;
  logLoading = false;
  if(tab==='log') renderLog(document.getElementById('main'));
}

// Soft-delete only: a deleted event keeps its data (flagged `deleted:true`)
// so it can be restored, and it's excluded from the daily in/out cap in
// resolveChooseAction/doCapture — deleting a mistaken entry immediately
// frees that staff member's slot again.
function deleteLogEntry(ds){
  if(!ds || !ds.staffId || !ds.month || !ds.day || !ds.eid) return;
  showConfirmModal(
    ds.name + '（' + (ds.type==='in' ? '出勤' : '退勤') + '）の記録を削除しますか？',
    ()=>setLogEntryDeleted(ds, true)
  );
}

function restoreLogEntry(ds){
  if(!ds || !ds.staffId || !ds.month || !ds.day || !ds.eid) return;
  showConfirmModal(
    ds.name + '（' + (ds.type==='in' ? '出勤' : '退勤') + '）の記録を復元しますか？',
    ()=>setLogEntryDeleted(ds, false)
  );
}

async function setLogEntryDeleted(ds, deletedVal){
  if(!db){ showToast('データ保存を利用できません'); return; }
  try{
    const ref = db.doc('attendance/' + ds.staffId + '_' + ds.month);
    const snap = await ref.get();
    if(!snap.exists){ showToast('記録が見つかりません'); return; }
    const days = snap.data().days || {};
    const dayObj = days[ds.day];
    const evs = (dayObj && Array.isArray(dayObj.events)) ? dayObj.events.slice() : [];
    const idx = evs.findIndex(ev => (ev.id ? ev.id : ('ts:'+ev.ts)) === ds.eid);
    if(idx===-1){ showToast('記録が見つかりません'); return; }
    evs[idx] = Object.assign({}, evs[idx], { deleted: deletedVal });
    await ref.update({ days: { [ds.day]: { events: evs } } });
    loadLogForDate();
  }catch(e){
    showToast(deletedVal ? '削除に失敗しました' : '復元に失敗しました');
  }
}

// Tapping a log row opens a time-edit modal pre-filled with its current
// time; confirming writes the new time back and flags the event `edited:
// true`, preserving the very first pre-edit time as `originalTime` (so
// re-editing an already-edited entry doesn't lose the true original) —
// that flag is what lets logListHtml show the "編集済" badge.
function editLogEntry(ds){
  if(!ds || !ds.staffId || !ds.month || !ds.day || !ds.eid) return;
  modalState = { kind:'editTime', ds, error:'' };
  renderModal();
}

async function submitModalEditTime(){
  if(!modalState || modalState.kind!=='editTime') return;
  const inp = document.getElementById('modalEditTimeInput');
  const val = inp ? inp.value : '';
  if(!val || !/^\d{2}:\d{2}$/.test(val)){
    modalState = Object.assign({}, modalState, { error:'正しい時刻を入力してください' });
    renderModal();
    return;
  }
  const ds = modalState.ds;
  closeModal();
  setLogEntryTime(ds, val);
}

async function setLogEntryTime(ds, newTime){
  if(!db){ showToast('データ保存を利用できません'); return; }
  try{
    const ref = db.doc('attendance/' + ds.staffId + '_' + ds.month);
    const snap = await ref.get();
    if(!snap.exists){ showToast('記録が見つかりません'); return; }
    const days = snap.data().days || {};
    const dayObj = days[ds.day];
    const evs = (dayObj && Array.isArray(dayObj.events)) ? dayObj.events.slice() : [];
    const idx = evs.findIndex(ev => (ev.id ? ev.id : ('ts:'+ev.ts)) === ds.eid);
    if(idx===-1){ showToast('記録が見つかりません'); return; }
    const old = evs[idx];
    if(old.time === newTime) return; // unchanged — skip the write, don't flag as edited
    const [hh, mm] = newTime.split(':').map(Number);
    const monthStr = String(ds.month);
    const newTs = new Date(Number(monthStr.slice(0,4)), Number(monthStr.slice(5,7))-1, Number(ds.day), hh, mm, 0, 0).getTime();
    evs[idx] = Object.assign({}, old, {
      time: newTime, ts: newTs, edited: true, originalTime: old.originalTime || old.time
    });
    await ref.update({ days: { [ds.day]: { events: evs } } });
    loadLogForDate();
  }catch(e){
    showToast('時刻の変更に失敗しました');
  }
}

/* ---------- modal (confirm / password) ----------
   Built by hand rather than window.confirm/prompt, so every yes/no or
   password check matches the app's own dark/gold look instead of the
   browser's default popup style. */
let modalState = null;

function showConfirmModal(message, onYes){
  modalState = { kind:'confirm', message, onYes };
  renderModal();
}

function showPasswordModal(onSuccess){
  modalState = { kind:'password', error:'', onSuccess };
  renderModal();
}

function closeModal(){
  modalState = null;
  renderModal();
}

function modalConfirmYes(){
  if(!modalState || modalState.kind!=='confirm') return;
  const cb = modalState.onYes;
  closeModal();
  if(cb) cb();
}

function submitModalPassword(){
  if(!modalState || modalState.kind!=='password') return;
  const inp = document.getElementById('modalPasswordInput');
  const val = inp ? inp.value : '';
  if(val === MANAGEMENT_PASSWORD){
    const cb = modalState.onSuccess;
    closeModal();
    if(cb) cb();
  } else {
    modalState = Object.assign({}, modalState, { error:'パスワードが違います' });
    renderModal();
  }
}

function renderModal(){
  let el = document.getElementById('modalEl');
  if(!modalState){
    if(el) el.remove();
    return;
  }
  if(!el){
    el = document.createElement('div');
    el.id = 'modalEl';
    el.className = 'modal-overlay';
    document.getElementById('app').appendChild(el);
  }
  if(modalState.kind==='confirm'){
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">${escapeHtml(modalState.message)}</div>
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalConfirmYes">OK</button>
        </div>
      </div>
    `;
  } else if(modalState.kind==='password'){
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">パスワードを入力してください</div>
        <input type="password" inputmode="numeric" autocomplete="off" class="modal-input" id="modalPasswordInput">
        ${modalState.error ? `<div class="modal-error">${escapeHtml(modalState.error)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalPasswordSubmit">確認</button>
        </div>
      </div>
    `;
    const inp = document.getElementById('modalPasswordInput');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitModalPassword(); });
    }
  } else if(modalState.kind==='editTime'){
    const ds = modalState.ds;
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">${escapeHtml(ds.name||'')}（${ds.type==='in' ? '出勤' : '退勤'}）の時刻を編集</div>
        <input type="time" class="modal-input modal-input-time" id="modalEditTimeInput" value="${escapeHtml(ds.time||'')}">
        ${modalState.error ? `<div class="modal-error">${escapeHtml(modalState.error)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalEditTimeSubmit">保存</button>
        </div>
      </div>
    `;
    const inp = document.getElementById('modalEditTimeInput');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitModalEditTime(); });
    }
  }
  el.onclick = (e)=>{ if(e.target===el) closeModal(); };
}

/* A cheap "how many photos have piled up" readout, so the count is visible
   without ever downloading the (much heavier) image data itself: RTDB's
   REST ?shallow=true returns just the child keys (true/false per key), not
   their contents, so this stays fast and light even after years of use. */
let settingsPhotoCountCache = null;
async function loadPhotoCount(forceRefresh){
  if(forceRefresh) settingsPhotoCountCache = null;
  if(settingsPhotoCountCache !== null){
    const el = document.getElementById('photoCountHint');
    if(el) el.textContent = photoCountLabel(settingsPhotoCountCache);
    return;
  }
  try{
    const res = await fetch(FIREBASE_CONFIG.databaseURL + '/' + fullPath('photos') + '.json?shallow=true');
    const data = await res.json();
    const count = data ? Object.keys(data).length : 0;
    settingsPhotoCountCache = count;
    const el = document.getElementById('photoCountHint');
    if(el) el.textContent = photoCountLabel(count);
  }catch(e){
    const el = document.getElementById('photoCountHint');
    if(el) el.textContent = '読み込みに失敗しました';
  }
}
function photoCountLabel(count){
  // Rough scale, not a precise byte count — recent photos run roughly
  // 30〜60KB each after compression (older ones saved before this could be
  // a bit bigger), so this stays honest about being an estimate.
  const roughMb = ((count * 45) / 1024).toFixed(1);
  return `保存されている写真：${count}枚（目安 約${roughMb}MB）`;
}

/* Photo ids are 'ph' + the creation time in base36 (a fixed 8 characters
   from 1976 through 2059) + a short random suffix, so a photo's age can be
   read straight off its own key — no need to fetch its (much heavier)
   dataUrl content just to decide whether it's old enough to purge. */
function tsFromPhotoId(id){
  if(typeof id !== 'string' || !id.startsWith('ph')) return null;
  const n = parseInt(id.slice(2, 10), 36);
  return Number.isFinite(n) ? n : null;
}

// Runs at most once/day (shared marker in config/, so any admin's device
// can be the one that happens to run it) and only ever deletes documents
// under photos/ — attendance/ (the actual time + quote record) is never
// touched here, matching what was described before turning this on.
async function maybeRunPhotoCleanup(){
  try{
    const markerUrl = FIREBASE_CONFIG.databaseURL + '/' + fullPath('config/photoCleanupLastRun') + '.json';
    const lastRun = await (await fetch(markerUrl)).json();
    if(lastRun && (Date.now() - lastRun) < PHOTO_CLEANUP_MIN_INTERVAL_MS) return;

    const listUrl = FIREBASE_CONFIG.databaseURL + '/' + fullPath('photos') + '.json?shallow=true';
    const data = await (await fetch(listUrl)).json();
    const keys = data ? Object.keys(data) : [];
    const cutoff = Date.now() - PHOTO_RETENTION_DAYS * 24 * 60 * 60 * 1000;
    const toDelete = keys.filter(k => { const t = tsFromPhotoId(k); return t !== null && t < cutoff; });

    if(toDelete.length){
      const patch = {};
      toDelete.forEach(k => { patch[k] = null; });
      await fetch(FIREBASE_CONFIG.databaseURL + '/' + fullPath('photos') + '.json', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
      });
      loadPhotoCount(true);
    }

    await fetch(markerUrl, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Date.now()) });
  }catch(e){ /* best-effort background maintenance; simply retried on the next visit */ }
}

/* ===== bulk staff photo change ("まとめて写真を変更") ===============
   Lets the admin pick several photo files in one native file-picker
   instead of tapping each staff avatar one at a time. Each picked file
   gets a live local preview (an object URL — no Firebase write yet) and
   a per-row dropdown assigning it to one staff member; "保存" then runs
   every assigned file through the exact same compression + staffPhotos/
   write path pickStaffPhoto's single-photo flow already uses, one at a
   time, so this never becomes a second, divergent upload implementation.
   Filename is only ever used as a same-session GUESS to pre-select a
   dropdown option (exact match on the filename's stem, or — only when
   unambiguous — a same-length-2+ substring match); it is never written
   anywhere, and the admin can repoint any row before saving. When two+
   staff share one name, that name alone can't disambiguate a filename
   match, so the guess is deliberately left blank for the admin to pick
   by hand — and each such row's dropdown options get a (写真あり/写真な
   し) suffix so the two same-named entries can actually be told apart. */
let bulkPhotoMode = false;
let bulkPhotoItems = [];   // [{file, previewUrl, assignedId}] — assignedId is a staffList id or null (skip)
let bulkPhotoSaving = false;

function guessStaffIdForFilename(filename){
  const stem = String(filename || '').replace(/\.[^.]+$/, '').trim();
  if(!stem) return null;
  const exact = staffList.filter(s=>s.name===stem);
  if(exact.length===1) return exact[0].id;
  if(exact.length>1) return null; // duplicate name — ambiguous, let the admin pick
  const contains = staffList.filter(s=>s.name && s.name.length>=2 && stem.includes(s.name));
  if(contains.length===1) return contains[0].id;
  return null;
}

function openBulkPhoto(){
  if(!db){ showToast('データ保存を利用できません'); return; }
  bulkPhotoMode = true;
  bulkPhotoItems = [];
  bulkPhotoSaving = false;
  renderApp();
}
function revokeBulkPhotoPreviews(){
  bulkPhotoItems.forEach(it=>{ try{ URL.revokeObjectURL(it.previewUrl); }catch(e){} });
}
function closeBulkPhoto(){
  revokeBulkPhotoPreviews();
  bulkPhotoMode = false;
  bulkPhotoItems = [];
  bulkPhotoSaving = false;
  renderApp();
}
function pickBulkPhotoFiles(){
  const input = document.getElementById('bulkPhotoFileInput');
  if(input) input.click();
}
function onBulkPhotoFilesSelected(e){
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if(!files.length) return;
  const newItems = files.map(file=>({
    file,
    previewUrl: URL.createObjectURL(file),
    assignedId: guessStaffIdForFilename(file.name)
  }));
  bulkPhotoItems = bulkPhotoItems.concat(newItems);
  renderApp();
}
function setBulkPhotoAssign(idx, staffId){
  const item = bulkPhotoItems[idx];
  if(!item) return;
  item.assignedId = staffId || null;
  renderApp();
}
function removeBulkPhotoItem(idx){
  const item = bulkPhotoItems[idx];
  if(!item) return;
  try{ URL.revokeObjectURL(item.previewUrl); }catch(e){}
  bulkPhotoItems.splice(idx, 1);
  renderApp();
}
async function saveBulkPhotos(){
  if(!db || bulkPhotoSaving) return;
  const targets = bulkPhotoItems.filter(it=>it.assignedId);
  if(!targets.length){ showToast('割り当て先が選ばれていません'); return; }
  const skippedCount = bulkPhotoItems.length - targets.length;
  bulkPhotoSaving = true;
  renderApp();
  let okCount = 0, failCount = 0;
  for(const item of targets){
    try{
      const dataUrl = await makeCompressedDataUrl(item.file, STAFF_PHOTO_ATTEMPTS, STAFF_PHOTO_MAX_CHARS);
      if(!dataUrl){ failCount++; continue; }
      await db.doc('staffPhotos/' + item.assignedId).set({ dataUrl, ts: Date.now() });
      staffPhotos[item.assignedId] = dataUrl;
      okCount++;
    }catch(e){ failCount++; }
  }
  staffPhotosLoadedAt = Date.now();
  revokeBulkPhotoPreviews();
  bulkPhotoMode = false;
  bulkPhotoItems = [];
  bulkPhotoSaving = false;
  renderApp();
  let msg = okCount + '件の写真を更新しました';
  if(failCount) msg += '（' + failCount + '件は失敗）';
  if(skippedCount) msg += '（' + skippedCount + '件は未割り当てのためスキップ）';
  showToast(msg);
}
function bulkPhotoHtml(){
  const nameCounts = {};
  staffList.forEach(s=>{ nameCounts[s.name] = (nameCounts[s.name] || 0) + 1; });
  const assignedCount = bulkPhotoItems.filter(it=>it.assignedId).length;
  return `
    <div class="section-title" style="display:flex; align-items:center; justify-content:space-between;">
      <span>まとめて写真を変更</span>
      <button class="btn ghost small" data-action="closeBulkPhoto">✕ 閉じる</button>
    </div>
    <div class="card">
      <div class="hint" style="margin-bottom:10px;">
        写真を複数選ぶと、ファイル名がスタッフ名と一致する人に自動で割り当てます。割り当て先は下のプルダウンで一人ずつ変更・解除できます。
      </div>
      <button class="btn gold block" data-action="pickBulkPhotoFiles">写真を選択（複数可）</button>
      <input type="file" accept="image/*" multiple id="bulkPhotoFileInput" class="visually-hidden-file">
    </div>
    ${bulkPhotoItems.length ? `
      <div class="card">
        ${bulkPhotoItems.map((item, i)=>{
          const unassigned = !item.assignedId;
          return `
          <div class="row bulk-photo-row${unassigned ? ' unassigned' : ''}">
            <img class="bulk-photo-thumb" src="${item.previewUrl}" alt="">
            <div class="bulk-photo-body">
              <div class="bulk-photo-filename">${escapeHtml(item.file.name)}</div>
              <select data-action="assignBulkPhoto" data-idx="${i}">
                <option value="">— 割り当てない —</option>
                ${staffList.map(s=>{
                  const dup = nameCounts[s.name] > 1;
                  const label = s.name + (dup ? (staffPhotos[s.id] ? '（写真あり）' : '（写真なし）') : '');
                  return `<option value="${escapeHtml(s.id)}" ${item.assignedId===s.id ? 'selected' : ''}>${escapeHtml(label)}</option>`;
                }).join('')}
              </select>
            </div>
            <button class="btn ghost small icon-only bulk-photo-remove" data-action="removeBulkPhotoItem" data-idx="${i}" title="このファイルを除外">✕</button>
          </div>
        `;
        }).join('')}
      </div>
      <button class="btn gold block" data-action="saveBulkPhotos" ${bulkPhotoSaving ? 'disabled' : ''}>
        ${bulkPhotoSaving ? '保存中…' : '一括で保存（' + assignedCount + '件）'}
      </button>
    ` : ''}
  `;
}

// A permanent id→name record of every staff member who has ever existed,
// separate from config/staff's *current* roster. loadLogForDate fetches
// each known id's own attendance doc directly (cheap, scales with
// headcount) instead of scanning the whole attendance collection (which
// used to re-download every staff member's entire history on every log
// view) — this archive is what lets a removed staff member's past
// records still show up there.
async function mergeIntoStaffArchive(id, name){
  try{
    const ref = db.doc('config/staffArchive');
    const snap = await ref.get();
    const archive = (snap.exists && snap.data()) || {};
    if(archive[id] !== name){
      archive[id] = name;
      await ref.set(archive);
    }
  }catch(e){ /* best-effort bookkeeping — loadLogForDate still works off whatever's already archived */ }
}

/* ---------- Excel export (月間サマリー) ---------- */
let exportingExcel = false;

// Plain browser download — no platform "save this file?" prompt to ask,
// just the normal save-to-downloads behavior any site gets.
function browserDownload(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function nextMonthKey(monthKey){
  const parts = monthKey.split('-').map(Number);
  const d = new Date(parts[0], parts[1], 1); // parts[1] is 1-12; used as a 0-based month index this lands on next month
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}

// "HH:MM" -> minutes since midnight, or null if not parseable.
function toMinutesOfDay(timeStr){
  if(typeof timeStr !== 'string') return null;
  const m = timeStr.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

// Reverse of the above, wrapping into a normal 0:00-23:59 clock time. The
// input can be fractional (an average) or beyond 1440 (a shifted
// late-night value — see computeStaffMonthSummary below).
function minutesToClockStr(mins){
  let m = Math.round(mins) % 1440;
  if(m < 0) m += 1440;
  return pad2(Math.floor(m/60)) + ':' + pad2(m%60);
}

// Every (non-deleted) in/out event for one staff member's whole month doc,
// flattened out of its day buckets, each tagged with the calendar date it
// actually happened on.
async function fetchMonthEventsFlat(staffId, monthKey){
  let data = null;
  try{
    const snap = await db.doc('attendance/' + staffId + '_' + monthKey).get();
    data = snap.exists ? snap.data() : null;
  }catch(e){ data = null; }
  const days = (data && data.days) || {};
  const out = [];
  Object.keys(days).forEach(dayKey=>{
    const events = (days[dayKey] && Array.isArray(days[dayKey].events)) ? days[dayKey].events : [];
    events.forEach(ev=>{
      if(ev.deleted) return;
      if(typeof ev.ts !== 'number' || (ev.type!=='in' && ev.type!=='out')) return;
      out.push({ ts: ev.ts, time: ev.time, type: ev.type, dateStr: monthKey + '-' + dayKey });
    });
  });
  return out;
}

// Pairs up 出勤/退勤 events into shifts and rolls them into one month's
// summary for one staff member. A host-club shift routinely runs past
// midnight, so a day-bucketed "just group by calendar day" approach (what
// the previous export deliberately avoided entirely) would misattribute or
// drop the back half of a late shift — instead this also pulls in the
// FOLLOWING month's events, walks everything in one chronological list,
// and pairs each 出勤 with the next 退勤 that follows it, wherever its own
// calendar date lands. A shift is credited to the month its 出勤 happened
// in; an 退勤 with no preceding open 出勤 in this window belongs to a shift
// that started before it (i.e. in the previous month) and is correctly
// skipped here rather than double-counted, since that earlier month's own
// summary already accounts for it.
async function computeStaffMonthSummary(staffId, monthKey){
  const [evThis, evNext] = await Promise.all([
    fetchMonthEventsFlat(staffId, monthKey),
    fetchMonthEventsFlat(staffId, nextMonthKey(monthKey)),
  ]);
  const all = evThis.map(e=>Object.assign({}, e, { inRange:true }))
    .concat(evNext.map(e=>Object.assign({}, e, { inRange:false })))
    .sort((a,b)=>a.ts-b.ts);

  const shifts = [];
  let openIn = null;
  all.forEach(ev=>{
    if(ev.type === 'in'){
      // A dangling 出勤 with no 退勤 before the next 出勤 shows up is still a
      // real (incomplete) shift — flagged via outEv:null below, not
      // silently dropped.
      if(openIn && openIn.inRange) shifts.push({ inEv: openIn, outEv: null });
      openIn = ev;
    } else {
      if(openIn){
        if(openIn.inRange) shifts.push({ inEv: openIn, outEv: ev });
        openIn = null;
      }
    }
  });
  if(openIn && openIn.inRange) shifts.push({ inEv: openIn, outEv: null });

  const relevant = shifts.filter(s => s.inEv.inRange);
  const daysWorked = new Set(relevant.map(s=>s.inEv.dateStr));
  const inMinutes = [];
  const outMinutesShifted = [];
  let totalMinutes = 0;
  let openCount = 0;

  relevant.forEach(s=>{
    const inM = toMinutesOfDay(s.inEv.time);
    if(inM !== null) inMinutes.push(inM);
    if(s.outEv){
      // Clock-outs cluster in the small hours (host-club closing time), so
      // a plain average would wrongly blend e.g. "01:30" with "23:45" into
      // a meaningless early-afternoon figure — shift anything before noon
      // by +24h before averaging, then wrap back for display.
      const outM = toMinutesOfDay(s.outEv.time);
      if(outM !== null) outMinutesShifted.push(outM < 720 ? outM + 1440 : outM);
      if(s.outEv.ts > s.inEv.ts) totalMinutes += Math.round((s.outEv.ts - s.inEv.ts) / 60000);
    } else {
      openCount++;
    }
  });

  return {
    daysWorked: daysWorked.size,
    totalHoursDecimal: Math.round((totalMinutes/60) * 10) / 10,
    totalHoursLabel: Math.floor(totalMinutes/60) + '時間' + (totalMinutes%60) + '分',
    avgIn: inMinutes.length ? minutesToClockStr(inMinutes.reduce((a,b)=>a+b,0)/inMinutes.length) : '',
    avgOut: outMinutesShifted.length ? minutesToClockStr(outMinutesShifted.reduce((a,b)=>a+b,0)/outMinutesShifted.length) : '',
    openCount,
  };
}

async function exportAttendanceExcel(){
  if(exportingExcel) return;
  const monthInput = document.getElementById('exportMonthInput');
  const monthKey = (monthInput && monthInput.value) ? monthInput.value : monthKeyOf(new Date());
  if(!db){ showToast('データ保存を利用できません'); return; }
  if(!staffList.length){ showToast('スタッフが登録されていません'); return; }

  exportingExcel = true;
  const btn = document.getElementById('exportExcelBtn');
  if(btn){ btn.disabled = true; btn.textContent = '書き出し中…'; }

  try{
    // One row per staff member who actually worked this month — 出勤日数・
    // 合計勤務時間・平均出退勤時刻・退勤未記録日数 — in place of the old flat
    // per-event log.
    const rows = [];
    for(const s of staffList){
      const summary = await computeStaffMonthSummary(s.id, monthKey);
      if(summary.daysWorked === 0) continue;
      rows.push(Object.assign({ staffName: s.name }, summary));
    }

    if(!rows.length){
      showToast('この月の記録はありません');
      return;
    }

    // Plain CSV: Excel opens this natively, and it needs no extra library
    // or network fetch to build (unlike a real .xlsx), so there's nothing
    // that can hang while generating it. totalHoursDecimal is a plain
    // number field so Excel treats it as a real number (時給 × this column
    // works immediately), not text.
    const header = ['スタッフ','出勤日数','合計勤務時間(時間)','合計勤務時間','平均出勤時刻','平均退勤時刻','退勤未記録日数'];
    const lines = [header.map(csvField).join(',')];
    rows.forEach(r=>{
      lines.push([
        r.staffName, r.daysWorked, r.totalHoursDecimal, r.totalHoursLabel,
        r.avgIn, r.avgOut, r.openCount,
      ].map(csvField).join(','));
    });
    const csvText = '﻿' + lines.join('\r\n') + '\r\n';
    const blob = new Blob([csvText], { type:'text/csv' });
    // ASCII-only filename: Chromium silently renames a blob-download's
    // saved file to a generic "download" when the <a download> attribute
    // contains Japanese characters (a real browser quirk, not specific to
    // any one machine) — the CSV's own content is still fully Japanese,
    // only the filename on disk is kept romaji so it always saves correctly.
    const filename = 'X8_monthly_summary_' + monthKey + '.csv';

    browserDownload(filename, blob);
  }catch(e){
    showToast('書き出しに失敗しました');
  }finally{
    exportingExcel = false;
    if(btn){ btn.disabled = false; btn.textContent = 'Excelで書き出す'; }
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
